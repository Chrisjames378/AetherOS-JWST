<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030508"/>
    </radialGradient>
    <linearGradient id="goldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#854d0e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#spaceBg)"/>
  
  <!-- Subtle Grid -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#eab308" stroke-opacity="0.1" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#38bdf8" stroke-opacity="0.15" stroke-dasharray="6,6"/>

  <!-- JWST Primary Mirror 18 Segment Array Grid -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Central Cluster Hexagons -->
    <polygon points="0,-40 34.6,-20 34.6,20 0,40 -34.6,20 -34.6,-20" fill="#020617" stroke="url(#goldGold)" stroke-width="3"/>
    
    <!-- Outer Ring Hexagons (18 segments total) -->
    <!-- Top row -->
    <g transform="translate(0, -70)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(32, -52.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-32, -52.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    
    <!-- Middle-upper row -->
    <g transform="translate(64, -35)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-64, -35)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    
    <!-- Middle row -->
    <g transform="translate(64, 0)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-64, 0)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>

    <g transform="translate(32, -17.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-32, -17.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(0, 0)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    
    <!-- Middle-lower row -->
    <g transform="translate(32, 17.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-32, 17.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(64, 35)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-64, 35)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    
    <!-- Bottom row -->
    <g transform="translate(0, 35)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(0, 70)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(32, 52.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
    <g transform="translate(-32, 52.5)"><polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="url(#goldGold)" stroke="#090d16" stroke-width="2"/></g>
  </g>
  
  <!-- Optical Diffraction Spikes -->
  <line x1="256" y1="50" x2="256" y2="462" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="77" y1="153" x2="435" y2="359" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="77" y1="359" x2="435" y2="153" stroke="#fef08a" stroke-width="1.5" stroke-opacity="0.6"/>
  
  <!-- Outer Ring Branding Text -->
  <text x="256" y="440" font-family="'Orbitron', sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="4">AETHER OS</text>
  <text x="256" y="462" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" fill="#eab308" text-anchor="middle" letter-spacing="3">JWST SIMULATOR</text>
</svg>
